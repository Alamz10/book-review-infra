# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  paths:
    include:
    - terraform/**
  branches:
    include:
      - main

stages:

- stage: Terraform
  displayName:
  jobs:
  - job: Terraform_Apply
    displayName: 'Terraform Apply'
    pool:
      vmImage: ubuntu-latest
      
    steps:

    - task: DownloadSecureFile@1
      name: download_ssh_key
      inputs:
        secureFile: 'id_ed25519.pub'
    
    - script: |
        echo "copying SSH public key into Terraform module"
          
        mkdir -p ~/.ssh
        cp $(download_ssh_key.secureFilePath) ~/.ssh/id_ed25519.pub
          
        cp $(download_ssh_key.secureFilePath)  terraform/modules/compute/id_ed25519.pub
        echo "Listing contents of terraform/modules/compute/"
        ls -al terraform/modules/compute/

      displayName: 'Extraxt SSH Public Key for Terraform'

  

    - task: AzureCLI@2
      inputs:
        azureSubscription: 'Azure subscription 1(f8ee80e8-752b-4d6e-b78e-6a1e3020c435)'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(system.DefaultWorkingDirectory)/terraform
        inlineScript: |
          echo "##[group] Terraform Init/Plan/Apply"
          
          terraform init -input=false
          terraform plan -input=false -var-file="env/dev.tfvars"
          terraform apply -input=false -auto-approve -var-file="env/dev.tfvars"
          echo "##[endgroup]"
